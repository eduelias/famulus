[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "famulus"
version = "0.2.0"
description = "Self-hosted personal AI assistant on WhatsApp: your models, your tools, your rules."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Eduardo Elias Saleh" }]
keywords = ["whatsapp", "assistant", "llm", "ollama", "self-hosted", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/eduelias/famulus"
Issues = "https://github.com/eduelias/famulus/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/famulus"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# RUF012: tool specs are declarative class attributes, mutation is never intended
# BLE001: we deliberately catch broad exceptions to surface tool/agent errors
#         back to the model or the owner rather than crash the webhook
ignore = ["RUF012", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
