# Checks for every push and pull request, and the first stage of a release (release.yml
# calls this workflow, so a tag only ships what passed the same checks).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # du7's image is python:3.12-slim
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  build:
    name: Build and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The wheel du7 installs
        run: |
          pip install -q build
          python -m build --wheel --outdir dist
          version=$(python3 -c 'import re,pathlib; print(re.search(r"^version = \"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text(), re.M)[1])')
          test -f "dist/famulus-$version-py3-none-any.whl"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install it in a clean venv, start it, ask /health
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q "dist/famulus-$VERSION-py3-none-any.whl"
          cd /tmp && DATA_DIR=/tmp/data /tmp/venv/bin/uvicorn famulus.main:app --port 8099 &
          for _ in $(seq 30); do curl -fsS localhost:8099/health && break; sleep 0.5; done
          test "$(curl -fsS localhost:8099/health | jq -r .version)" = "$VERSION"
          echo "famulus $VERSION: installs from the wheel, starts and answers /health" >> "$GITHUB_STEP_SUMMARY"
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
